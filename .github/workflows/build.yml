name: Build EHook Binaries

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Android NDK
      uses: android-actions/setup-ndk@v3
      with:
        ndk-version: r26b

    - name: Compile with ndk-build
      run: |
        ndk-build

    - name: Upload Compiled Binaries
      uses: actions/upload-artifact@v4
      with:
        name: ehook-compiled-binaries
        path: |
          libs/
          obj/
